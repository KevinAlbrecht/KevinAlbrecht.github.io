<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGPテストページ｜サンプルタイトル</title>

    <!-- Balises OGP Standards (Facebook, LINE, Discord, etc.) -->
    <meta
      property="og:title"
      content="【テスト】OGP表示確認用のサンプルタイトルです"
    />
    <meta
      property="og:description"
      content="これはSNSシェア時のカード表示をテストするためのダミー説明文です。日本語の折り返しや文字数制限の確認に使用します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kevinalbrecht.github.io/" />
    <!-- Incrémenter v lors du remplacement de l'image pour changer son URL de cache. -->
    <meta
      property="og:image"
      content="https://kevinalbrecht.github.io/img.jpeg?v=2"
    />
    <meta property="og:site_name" content="テストサイト名" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Balises spécifiques Twitter (X) -->
    <!-- "summary_large_image" affiche une grande bannière -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="【テスト】OGP表示確認用のサンプルタイトルです"
    />
    <meta
      name="twitter:description"
      content="これはSNSシェア時のカード表示をテストするためのダミー説明文です。"
    />
    <meta
      name="twitter:image"
      content="https://kevinalbrecht.github.io/img.jpeg?v=2"
    />
  </head>
  <body>
    <h1>OGPテストページ</h1>
    <p>
      このページはTwitter（X）のカード表示を確認するためのテスト用HTMLです。
    </p>
    <img
      id="shareImage"
      src="./img.jpeg?v=2"
      alt="テスト画像"
      style="max-width: 100%; height: auto"
    /><br /><br />

    <button
      id="shareButton"
      style="
        padding: 12px 24px;
        font-size: 16px;
        background-color: #1da1f2;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      "
    >
      共有する (Share)
    </button>
    <button
      id="shareImageButton"
      disabled
      aria-describedby="shareImageStatus"
      style="
        padding: 12px 24px;
        font-size: 16px;
        background-color: #187744;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      "
    >
      画像を共有する (Share image)
    </button>
    <p id="shareImageStatus" role="status">画像を準備しています…</p>

    <script>
      function getShareMetadata() {
        return {
          title: "【テスト】OGP表示確認用のサンプルタイトルです",
          url: window.location.href,
        };
      }

      document
        .getElementById("shareButton")
        .addEventListener("click", async () => {
          const shareData = {
            ...getShareMetadata(),
            text: "OGPテストページの共有です",
          };

          try {
            if (navigator.share) {
              await navigator.share(shareData);
            } else {
              // Fallback pour les navigateurs bureau qui ne supportent pas le Web Share API
              await navigator.clipboard.writeText(shareData.url);
              alert("URLをクリップボードにコピーしました！");
            }
          } catch (err) {
            console.log("共有がキャンセルされたか、エラーが発生しました", err);
          }
        });

      const shareImageButton = document.getElementById("shareImageButton");
      const shareImageStatus = document.getElementById("shareImageStatus");
      let imageFile;

      // Précharger le fichier pour appeler share() directement lors du clic.
      async function prepareImageShare() {
        if (!navigator.share || !navigator.canShare) {
          shareImageStatus.textContent =
            "このブラウザーは画像ファイルの共有に対応していません。";
          return;
        }

        try {
          const response = await fetch(document.getElementById("shareImage").src);
          if (!response.ok) {
            throw new Error(`Image request failed: ${response.status}`);
          }
          const blob = await response.blob();
          imageFile = new File([blob], "img.jpeg", { type: "image/jpeg" });

          if (!navigator.canShare({ ...getShareMetadata(), files: [imageFile] })) {
            shareImageStatus.textContent =
              "このブラウザーは画像ファイルの共有に対応していません。";
            return;
          }

          shareImageButton.disabled = false;
          shareImageStatus.textContent =
            "画像ファイルとページのタイトル、URLを共有します。";
        } catch (err) {
          shareImageStatus.textContent =
            "画像を読み込めませんでした。ページを再読み込みしてください。";
          console.error("画像の準備に失敗しました", err);
        }
      }

      shareImageButton.addEventListener("click", async () => {
        shareImageButton.disabled = true;
        try {
          await navigator.share({ ...getShareMetadata(), files: [imageFile] });
          shareImageStatus.textContent = "画像の共有操作が完了しました。";
        } catch (err) {
          shareImageStatus.textContent =
            err.name === "AbortError"
              ? "画像の共有がキャンセルされました。"
              : "画像を共有できませんでした。もう一度お試しください。";
          if (err.name !== "AbortError") {
            console.error("画像の共有に失敗しました", err);
          }
        } finally {
          shareImageButton.disabled = false;
        }
      });

      prepareImageShare();
    </script>
  </body>
</html>
